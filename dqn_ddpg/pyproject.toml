[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dqn-ddpg-comparison"
version = "0.1.0"
description = "Educational reinforcement learning project comparing DQN and DDPG algorithms"
readme = "CLAUDE.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "DQN-DDPG Research Team"}
]
keywords = ["reinforcement-learning", "deep-learning", "dqn", "ddpg", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Education",
]

dependencies = [
    "torch>=1.10.0",
    "torchvision",
    "numpy>=1.20.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "gymnasium[classic_control]>=0.26.0",
    "opencv-python>=4.5.0",
    "tqdm>=4.60.0",
    "pyyaml>=6.0",
    "tensorboard>=2.8.0",
    "imageio>=2.15.0",
    "imageio-ffmpeg",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "black>=22.0",
    "isort>=5.0",
    "flake8>=4.0",
]

[project.scripts]
dqn-ddpg-train = "scripts.experiments.run_experiment:main"
dqn-ddpg-compare = "scripts.experiments.run_same_env_experiment:main"
dqn-ddpg-video = "scripts.video.core.create_realtime_combined_videos:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "experiments*", "scripts*"]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["src", "experiments", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]