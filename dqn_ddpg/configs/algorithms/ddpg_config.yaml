# DDPG Configuration
agent:
  actor_lr: 0.0001
  critic_lr: 0.001
  gamma: 0.99
  tau: 0.005  # Polyak averaging parameter
  noise_sigma: 0.2
  noise_decay: 0.995
  buffer_size: 100000
  batch_size: 64

training:
  episodes: 300
  max_steps_per_episode: 200
  save_freq: 50
  eval_freq: 10
  eval_episodes: 5
  warmup_steps: 1000  # Random actions before training

# GPU 최적화 설정
gpu:
  # GPU 사용 여부 (auto: 자동 감지, true: 강제 사용, false: CPU만 사용)
  enabled: auto
  # 특정 GPU 디바이스 ID (null이면 자동 선택)
  device_id: null
  # GPU 버퍼 사용 여부
  use_gpu_buffer: true
  # Mixed Precision Training 사용 여부
  use_mixed_precision: true
  # CUDA 최적화 옵션
  cuda_options:
    allow_tf32: true
    benchmark: true
    deterministic: false
  # 메모리 관리
  memory:
    # 주기적 메모리 정리 간격 (스텝 수)
    cleanup_interval: 1000
    # GPU 메모리 사용량 모니터링
    monitor_usage: true

# 네트워크 아키텍처 설정
network:
  # Actor 네트워크 설정
  actor:
    hidden_dims: [400, 300]
    use_layer_norm: false
    dropout_rate: 0.0
  # Critic 네트워크 설정
  critic:
    hidden_dims: [400, 300]
    use_layer_norm: false
    dropout_rate: 0.0

environment:
  name: "Pendulum-v1"
  seed: 42