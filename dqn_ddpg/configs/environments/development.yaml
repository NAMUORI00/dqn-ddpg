# Development Environment Configuration
# Optimized for fast development and debugging

gpu:
  cuda_options:
    deterministic: false  # Prioritize performance over reproducibility
    benchmark: true

video:
  quality: "preview"  # Fast rendering for development
  fps: 15
  resolution: [640, 480]

training:
  max_episodes: 1000  # Shorter for quick testing
  eval_frequency: 50
  save_frequency: 25

logging:
  level: "DEBUG"
  console: true
  file: true
  structured: false

# Development-specific algorithm settings
algorithms:
  dqn:
    agent:
      buffer_size: 10000  # Smaller buffer for faster startup
      batch_size: 32
    environment:
      max_episode_steps: 200  # Shorter episodes for quick testing
  
  ddpg:
    agent:
      buffer_size: 10000
      batch_size: 32
    environment:
      max_episode_steps: 100